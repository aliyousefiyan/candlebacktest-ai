name: Build ChatGPT skill plugin candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and smoke-test packaged plugin
        run: python scripts/build_chatgpt_plugin.py --smoke
      - name: Keep tested candidate ZIP as CI artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: skills-plugin-candidate
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
